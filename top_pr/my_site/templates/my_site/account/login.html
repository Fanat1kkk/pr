{% extends "my_site/base.html" %} 

{% block login %}
<main class="bg-gray-100 xs:pt-8">
  <div class="min-h-screen flex flex-col justify-center items-center">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Вход</h2>

      <form action="#" method="POST" class="space-y-6">
        <!-- Поле для электронной почты -->
        <div>
          <label for="email" class="block text-sm font-medium text-red-700"
            >Электронная почта</label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
          />
        </div>

        <!-- Поле для пароля -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700"
            >Пароль</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-700"
          />
        </div>

        <!-- Кнопка отправки -->
        <div>
          <button
            type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition duration-300"
          >
            Войти
          </button>
        </div>

        <!-- Ссылка на регистрацию -->
        <p class="text-center text-sm text-gray-600">
          Нет аккаунта?
          <a href="#" class="text-blue-500 hover:underline"
            >Зарегистрироваться</a
          >
        </p>
      </form>
    </div>
  </div>
</main>
{% endblock login %}
