{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4">
    <article class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
        {% if post.image %}
        <img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-full rounded-md mb-4">
        {% endif %}
        <h1 class="text-3xl font-bold">{{ post.title }}</h1>
        <p class="text-gray-500 text-sm">{{ post.created_at|date:"d M Y" }}</p>
        <div class="mt-4 text-gray-700">{{ post.content|safe }}</div>
    </article>
</div>
{% endblock %}
